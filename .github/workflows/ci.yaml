name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

env:
  # The xcode-27 arm64 image runs macOS 27 (currently a public preview).
  # https://github.blog/changelog/2026-09-10-xcode-27-runner-image-now-runs-on-macos-27/
  CARGO_TERM_COLOR: always
  NEXTEST_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: make frontend-fmt-check
      - name: Run lint
        run: make frontend-lint
      - name: Run typecheck
        run: make typecheck
      - name: Run tests
        run: make frontend-test
      - name: Build frontend
        run: make frontend-build

  rust:
    name: Rust
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Prefer rustup proxies over preinstalled Homebrew rustup-init
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install nextest
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: nextest
      - name: Check formatting
        run: make rust-fmt-check
      - name: Run lint
        run: make rust-lint
      - name: Run tests
        run: make rust-test
      - name: Test runtime measurement tool
        run: make tools-test

  deny-check:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: make deny-check

  bundle:
    name: macOS bundle build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Prefer rustup proxies over preinstalled Homebrew rustup-init
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
      # `createUpdaterArtifacts` makes the bundler sign the .app.tar.gz, which
      # needs a private key even for a debug build. Generate a throwaway key so
      # CI exercises the exact same bundle path (targets, icons, updater
      # signing) as a release without touching the real signing secret; the
      # resulting signature is discarded. A pubkey-mismatch warning is expected
      # and harmless here.
      - name: Generate throwaway updater signing key
        run: pnpm tauri signer generate --ci -p "" -w "${RUNNER_TEMP}/updater-key"
      # Debug build: catches a broken bundle config here instead of on a tag push.
      - name: Build debug bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat "${RUNNER_TEMP}/updater-key")" \
            pnpm tauri build --debug
      - name: Verify application bundle signature
        run: codesign --verify --deep --strict --verbose=2 target/debug/bundle/macos/Tomari.app
