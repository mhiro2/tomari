name: Release

on:
  push:
    tags:
      - "v*"

# Never cancel a release mid-publish; a newer tag waits for the running one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

env:
  # The xcode-27 arm64 image runs macOS 27 (currently a public preview).
  # https://github.blog/changelog/2026-09-10-xcode-27-runner-image-now-runs-on-macos-27/
  CARGO_TERM_COLOR: always
  NEXTEST_COLOR: always

jobs:
  # Mirrors the frontend + rust jobs from ci.yaml so a tag build never
  # publishes a release that hasn't passed fmt/lint/test. Kept as minimal,
  # self-contained jobs rather than a reusable workflow to avoid the extra
  # indirection of workflow_call for two jobs.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: make frontend-fmt-check
      - name: Run lint
        run: make frontend-lint
      - name: Run typecheck
        run: make typecheck
      - name: Run tests
        run: make frontend-test
      - name: Build frontend
        run: make frontend-build

  rust:
    name: Rust
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Prefer rustup proxies over preinstalled Homebrew rustup-init
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install nextest
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: nextest
      - name: Check formatting
        run: make rust-fmt-check
      - name: Run lint
        run: make rust-lint
      - name: Run tests
        run: make rust-test
      - name: Test runtime measurement tool
        run: make tools-test

  # The same dependency policy gate as CI. A tag can be pushed from a commit
  # that never went through CI, so the release graph must not publish an
  # artifact whose advisories, licenses, bans or sources were never checked.
  deny-check:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: make deny-check

  release:
    name: macOS release
    needs: [frontend, rust, deny-check]
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # toolchain version comes from rust-toolchain.toml
      - name: Prefer rustup proxies over preinstalled Homebrew rustup-init
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # No dependency cache in the publishing job: a poisoned cache entry
      # would otherwise flow straight into the signed release artifacts.
      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3.1.1
        with:
          require-lockfile: true
      # The updater compares against the version baked into the bundle, so a
      # tag that doesn't match tauri.conf.json would publish a release that
      # existing installs never pick up.
      - name: Verify tag matches app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}" >&2
            exit 1
          fi
      # Builds the bundles, signs the updater artifacts, and publishes a draft
      # GitHub release with the dmg, the .app.tar.gz updater archive and the
      # latest.json manifest that `tauri-plugin-updater` polls.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tomari ${{ github.ref_name }}
          releaseDraft: true
